        description: List Workspace Variables
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: workspace_id
          in: path
          type: string
          required: true
      - name: createworkspacevariable
        method: POST
        description: Create a Workspace Variable
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
