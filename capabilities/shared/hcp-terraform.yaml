naftiko: "1.0.0-alpha1"

info:
  label: "HCP Terraform API"
  description: >-
    The HCP Terraform API provides programmatic access to HCP Terraform features
    including workspace management, infrastructure runs, state versioning, policy
    enforcement, teams, and organization management via JSON API.
  tags:
    - Terraform
    - Infrastructure As Code
    - Workspaces
    - DevOps
    - HashiCorp
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      HCP_TERRAFORM_TOKEN: HCP_TERRAFORM_TOKEN

capability:
  consumes:
    - type: http
      namespace: hcp-terraform
      baseUri: https://app.terraform.io/api/v2
      description: "HCP Terraform REST API using JSON API spec"
      authentication:
        type: bearer
        token: "{{HCP_TERRAFORM_TOKEN}}"
      resources:
        - name: organizations
          path: /organizations
          description: "Manage HCP Terraform organizations"
          operations:
            - name: list-organizations
              method: GET
              description: "List all organizations accessible by the current token"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-organization
              method: POST
              description: "Create a new organization"
              body:
                type: json
                data:
                  data:
                    type: "organizations"
                    attributes:
                      name: "{{tools.name}}"
                      email: "{{tools.email}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: organization
          path: /organizations/{organization_name}
          description: "Manage a specific organization"
          operations:
            - name: get-organization
              method: GET
              description: "Get details of a specific organization"
              inputParameters:
                - name: organization_name
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-organization
              method: DELETE
              description: "Delete an organization"
              inputParameters:
                - name: organization_name
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: workspaces
          path: /organizations/{organization_name}/workspaces
          description: "Manage workspaces within an organization"
          operations:
            - name: list-workspaces
              method: GET
              description: "List all workspaces in an organization"
              inputParameters:
                - name: organization_name
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
                - name: search[name]
                  in: query
                  type: string
                  required: false
                  description: "Filter workspaces by name"
                - name: page[number]
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: page[size]
                  in: query
                  type: integer
                  required: false
                  description: "Page size"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-workspace
              method: POST
              description: "Create a new workspace"
              inputParameters:
                - name: organization_name
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              body:
                type: json
                data:
                  data:
                    type: "workspaces"
                    attributes:
                      name: "{{tools.name}}"
                      description: "{{tools.description}}"
                      auto-apply: "{{tools.auto_apply}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: workspace
          path: /workspaces/{workspace_id}
          description: "Manage a specific workspace"
          operations:
            - name: get-workspace
              method: GET
              description: "Get details of a specific workspace"
              inputParameters:
                - name: workspace_id
                  in: path
                  type: string
                  required: true
                  description: "Workspace ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-workspace
              method: DELETE
              description: "Delete a workspace"
              inputParameters:
                - name: workspace_id
                  in: path
                  type: string
                  required: true
                  description: "Workspace ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: workspace-lock
          path: /workspaces/{workspace_id}/actions/lock
          description: "Lock a workspace to prevent runs"
          operations:
            - name: lock-workspace
              method: POST
              description: "Lock a workspace"
              inputParameters:
                - name: workspace_id
                  in: path
                  type: string
                  required: true
                  description: "Workspace ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: workspace-unlock
          path: /workspaces/{workspace_id}/actions/unlock
          description: "Unlock a workspace to allow runs"
          operations:
            - name: unlock-workspace
              method: POST
              description: "Unlock a workspace"
              inputParameters:
                - name: workspace_id
                  in: path
                  type: string
                  required: true
                  description: "Workspace ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: runs
          path: /runs
          description: "Create Terraform runs"
          operations:
            - name: create-run
              method: POST
              description: "Create a new Terraform run for a workspace"
              body:
                type: json
                data:
                  data:
                    type: "runs"
                    attributes:
                      message: "{{tools.message}}"
                      is-destroy: "{{tools.is_destroy}}"
                    relationships:
                      workspace:
                        data:
                          type: "workspaces"
                          id: "{{tools.workspace_id}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: run
          path: /runs/{run_id}
          description: "Manage a specific run"
          operations:
            - name: get-run
              method: GET
              description: "Get details of a specific run"
              inputParameters:
                - name: run_id
                  in: path
                  type: string
                  required: true
                  description: "Run ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: run-apply
          path: /runs/{run_id}/actions/apply
          description: "Apply a run"
          operations:
            - name: apply-run
              method: POST
              description: "Apply a run that is pending confirmation"
              inputParameters:
                - name: run_id
                  in: path
                  type: string
                  required: true
                  description: "Run ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: run-discard
          path: /runs/{run_id}/actions/discard
          description: "Discard a run"
          operations:
            - name: discard-run
              method: POST
              description: "Discard a run that has not yet been applied"
              inputParameters:
                - name: run_id
                  in: path
                  type: string
                  required: true
                  description: "Run ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: workspace-runs
          path: /workspaces/{workspace_id}/runs
          description: "List runs for a workspace"
          operations:
            - name: list-workspace-runs
              method: GET
              description: "List all runs for a given workspace"
              inputParameters:
                - name: workspace_id
                  in: path
                  type: string
                  required: true
                  description: "Workspace ID"
                - name: filter[status]
                  in: query
                  type: string
                  required: false
                  description: "Filter by run status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: state-versions
          path: /workspaces/{workspace_id}/state-versions
          description: "Manage workspace state versions"
          operations:
            - name: list-state-versions
              method: GET
              description: "List state versions for a workspace"
              inputParameters:
                - name: workspace_id
                  in: path
                  type: string
                  required: true
                  description: "Workspace ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: teams
          path: /organizations/{organization_name}/teams
          description: "Manage organization teams"
          operations:
            - name: list-teams
              method: GET
              description: "List all teams in an organization"
              inputParameters:
                - name: organization_name
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-team
              method: POST
              description: "Create a new team"
              inputParameters:
                - name: organization_name
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              body:
                type: json
                data:
                  data:
                    type: "teams"
                    attributes:
                      name: "{{tools.name}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: policies
          path: /organizations/{organization_name}/policies
          description: "Manage Sentinel and OPA policies"
          operations:
            - name: list-policies
              method: GET
              description: "List all policies in an organization"
              inputParameters:
                - name: organization_name
                  in: path
                  type: string
                  required: true
                  description: "Organization name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: hcp-terraform-rest
      resources:
        - path: /v1/organizations
          name: organizations
          description: "Organization management"
          operations:
            - method: GET
              name: list-organizations
              description: "List organizations"
              call: "hcp-terraform.list-organizations"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-organization
              description: "Create an organization"
              call: "hcp-terraform.create-organization"
              with:
                name: "rest.name"
                email: "rest.email"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/organizations/{organization_name}/workspaces
          name: workspaces
          description: "Workspace management"
          operations:
            - method: GET
              name: list-workspaces
              description: "List workspaces"
              call: "hcp-terraform.list-workspaces"
              with:
                organization_name: "rest.organization_name"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-workspace
              description: "Create a workspace"
              call: "hcp-terraform.create-workspace"
              with:
                organization_name: "rest.organization_name"
                name: "rest.name"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/workspaces/{workspace_id}
          name: workspace
          description: "Single workspace operations"
          operations:
            - method: GET
              name: get-workspace
              description: "Get workspace"
              call: "hcp-terraform.get-workspace"
              with:
                workspace_id: "rest.workspace_id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/runs
          name: runs
          description: "Run management"
          operations:
            - method: POST
              name: create-run
              description: "Create a run"
              call: "hcp-terraform.create-run"
              with:
                workspace_id: "rest.workspace_id"
                message: "rest.message"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/workspaces/{workspace_id}/runs
          name: workspace-runs
          description: "Workspace run listing"
          operations:
            - method: GET
              name: list-workspace-runs
              description: "List workspace runs"
              call: "hcp-terraform.list-workspace-runs"
              with:
                workspace_id: "rest.workspace_id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: hcp-terraform-mcp
      transport: http
      tools:
        - name: list-organizations
          description: "List all HCP Terraform organizations"
          hints:
            readOnly: true
            openWorld: true
          call: "hcp-terraform.list-organizations"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-workspaces
          description: "List workspaces in an organization"
          hints:
            readOnly: true
            openWorld: true
          call: "hcp-terraform.list-workspaces"
          with:
            organization_name: "tools.organization_name"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-workspace
          description: "Get details of a specific workspace"
          hints:
            readOnly: true
            openWorld: false
          call: "hcp-terraform.get-workspace"
          with:
            workspace_id: "tools.workspace_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-workspace
          description: "Create a new Terraform workspace"
          hints:
            readOnly: false
            destructive: false
          call: "hcp-terraform.create-workspace"
          with:
            organization_name: "tools.organization_name"
            name: "tools.name"
          outputParameters:
            - type: object
              mapping: "$."
        - name: lock-workspace
          description: "Lock a workspace to prevent new runs"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "hcp-terraform.lock-workspace"
          with:
            workspace_id: "tools.workspace_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: unlock-workspace
          description: "Unlock a workspace to allow runs"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "hcp-terraform.unlock-workspace"
          with:
            workspace_id: "tools.workspace_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-run
          description: "Create a new Terraform infrastructure run"
          hints:
            readOnly: false
            destructive: false
          call: "hcp-terraform.create-run"
          with:
            workspace_id: "tools.workspace_id"
            message: "tools.message"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-run
          description: "Get details of a Terraform run"
          hints:
            readOnly: true
            openWorld: false
          call: "hcp-terraform.get-run"
          with:
            run_id: "tools.run_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: apply-run
          description: "Apply a Terraform run pending confirmation"
          hints:
            readOnly: false
            destructive: false
          call: "hcp-terraform.apply-run"
          with:
            run_id: "tools.run_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: discard-run
          description: "Discard a Terraform run"
          hints:
            readOnly: false
            destructive: true
            idempotent: false
          call: "hcp-terraform.discard-run"
          with:
            run_id: "tools.run_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-workspace-runs
          description: "List all runs for a workspace"
          hints:
            readOnly: true
            openWorld: true
          call: "hcp-terraform.list-workspace-runs"
          with:
            workspace_id: "tools.workspace_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-state-versions
          description: "List state versions for a workspace"
          hints:
            readOnly: true
            openWorld: true
          call: "hcp-terraform.list-state-versions"
          with:
            workspace_id: "tools.workspace_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-teams
          description: "List teams in an organization"
          hints:
            readOnly: true
            openWorld: true
          call: "hcp-terraform.list-teams"
          with:
            organization_name: "tools.organization_name"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-policies
          description: "List Sentinel/OPA policies in an organization"
          hints:
            readOnly: true
            openWorld: true
          call: "hcp-terraform.list-policies"
          with:
            organization_name: "tools.organization_name"
          outputParameters:
            - type: object
              mapping: "$."
