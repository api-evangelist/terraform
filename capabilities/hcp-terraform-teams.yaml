naftiko: 1.0.0-alpha2
info:
  label: HCP Terraform API — Teams
  description: 'HCP Terraform API — Teams. 4 operations. Lead operation: List Teams. Self-contained Naftiko capability covering
    one Terraform business surface.'
  tags:
  - Terraform
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERRAFORM_API_KEY: TERRAFORM_API_KEY
capability:
  consumes:
  - type: http
    namespace: hcp-terraform-teams
    baseUri: https://app.terraform.io/api/v2
    description: HCP Terraform API — Teams business capability. Self-contained, no shared references.
    resources:
    - name: organizations-organization_name-teams
      path: /organizations/{organization_name}/teams
      operations:
      - name: listteams
        method: GET
        description: List Teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization_name
          in: path
          type: string
          required: true
        - name: page[number]
          in: query
          type: integer
        - name: page[size]
          in: query
          type: integer
      - name: createteam
        method: POST
        description: Create a Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organization_name
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: teams-team_id
      path: /teams/{team_id}
      operations:
      - name: getteam
        method: GET
        description: Get a Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team_id
          in: path
          type: string
          required: true
      - name: deleteteam
        method: DELETE
        description: Delete a Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: team_id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.TERRAFORM_API_KEY}}'
  exposes:
  - type: rest
    namespace: hcp-terraform-teams-rest
    port: 8080
    description: REST adapter for HCP Terraform API — Teams. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/organizations/{organization-name}/teams
      name: organizations-organization-name-teams
      description: REST surface for organizations-organization_name-teams.
      operations:
      - method: GET
        name: listteams
        description: List Teams
        call: hcp-terraform-teams.listteams
        with:
          organization_name: rest.organization_name
          page[number]: rest.page[number]
          page[size]: rest.page[size]
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createteam
        description: Create a Team
        call: hcp-terraform-teams.createteam
        with:
          organization_name: rest.organization_name
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teams/{team-id}
      name: teams-team-id
      description: REST surface for teams-team_id.
      operations:
      - method: GET
        name: getteam
        description: Get a Team
        call: hcp-terraform-teams.getteam
        with:
          team_id: rest.team_id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteteam
        description: Delete a Team
        call: hcp-terraform-teams.deleteteam
        with:
          team_id: rest.team_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hcp-terraform-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for HCP Terraform API — Teams. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-teams
      description: List Teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hcp-terraform-teams.listteams
      with:
        organization_name: tools.organization_name
        page[number]: tools.page[number]
        page[size]: tools.page[size]
      outputParameters:
      - type: object
        mapping: $.
    - name: create-team
      description: Create a Team
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: hcp-terraform-teams.createteam
      with:
        organization_name: tools.organization_name
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-team
      description: Get a Team
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hcp-terraform-teams.getteam
      with:
        team_id: tools.team_id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-team
      description: Delete a Team
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: hcp-terraform-teams.deleteteam
      with:
        team_id: tools.team_id
      outputParameters:
      - type: object
        mapping: $.
