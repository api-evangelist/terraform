    description: Terraform Registry API — Modules business capability. Self-contained, no shared references.
    resources:
    - name: v1-modules
      path: /v1/modules
      operations:
      - name: listmodules
        method: GET
        description: List Modules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of results to return
        - name: offset
          in: query
          type: integer
          description: Starting position for pagination
        - name: provider
          in: query
          type: string
          description: Filter modules by provider (e.g., aws, azurerm, google)
        - name: verified
          in: query
          type: boolean
          description: Filter to show only HashiCorp-verified modules
    - name: v1-modules-search
