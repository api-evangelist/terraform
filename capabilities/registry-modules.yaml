          description: Maximum number of results to return
        - name: offset
          in: query
          type: integer
          description: Starting position for pagination
        - name: provider
          in: query
          type: string
          description: Filter results by provider
        - name: verified
          in: query
          type: boolean
          description: Show only verified modules
