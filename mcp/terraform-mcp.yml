description: 'HashiCorp publishes an official open-source Terraform MCP server that exposes the Terraform
  Registry APIs and HCP Terraform / Terraform Enterprise workspace operations to AI agents. It is self-hosted
  (no HashiCorp-operated remote URL): run the Docker image or the Go binary and connect over stdio or
  streamable HTTP.'
server:
  name: terraform
  transports:
  - stdio
  - streamable-http
  hosted_url: null
  note: No HashiCorp-operated hosted endpoint — deploy your own. Streamable-HTTP defaults to port 8080
    at path /mcp with a /health check.
  docker_image: hashicorp/terraform-mcp-server
  install:
    docker: docker run -i --rm hashicorp/terraform-mcp-server
    go: go install github.com/hashicorp/terraform-mcp-server/cmd/terraform-mcp-server@latest
  env:
  - TFE_TOKEN
  - TFE_ADDRESS
  - TRANSPORT_MODE
  - MCP_ORGANIZATION_ALLOWLIST
